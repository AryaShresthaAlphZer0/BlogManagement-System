<!DOCTYPE html>
<html>
<head>
    <title>Delete Blog</title>
</head>
<body>

    <h1>Delete Blog</h1>

    <p>Are you sure you want to delete this blog?</p>

    <h2>{{ blog.title }}</h2>
    <p>{{ blog.description }}</p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>
    </form>

    <br>

    <a href="{% url 'Blog_list' %}">Cancel</a>

</body>
</html>
