
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Blog | InkSpace</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<nav class="navbar">
    <div class="nav-inner">
        <a class="logo" href="{% url 'Blog_list' %}">Ink<span>Space.</span></a>
        <a class="btn btn-secondary" href="{% url 'Blog_list' %}">← Dashboard</a>
    </div>
</nav>

<main class="container">
    <div class="form-card">
        <p class="author">DELETE ARTICLE</p>
        <h1>Are you sure?</h1>
        <p class="subtitle">
            You're about to delete this blog. This action cannot be undone.
        </p>

        <div class="blog-card" style="margin:24px 0">
            <h2>{{ blog.title }}</h2>
            <p class="blog-description">{{ blog.description }}</p>
            <p class="author">Written by {{ blog.user.username }}</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">
                Yes, Delete Blog
            </button>
            <a class="btn btn-secondary" href="{% url 'Blog_list' %}">
                Keep Blog
            </a>
        </form>
    </div>
</main>
</body>
</html>
