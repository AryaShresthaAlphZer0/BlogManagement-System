
<!DOCTYPE html>
<html>
<head>
    <title>Edit Blog</title>
</head>
<body>

    <h1>Edit Blog</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Title:</label>
        <input type="text" name="title" value="{{ blog.title }}" required>

        <br><br>

        <label>Content:</label>
        <textarea name="content" rows="10" cols="50" required>{{ blog.content }}</textarea>

        <br><br>

        <button type="submit">Update Blog</button>
    </form>

    <br>

    <a href="{% url 'Blog_list' %}">Cancel</a>

</body>
</html>
