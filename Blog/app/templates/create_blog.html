<!DOCTYPE html>
<html>
<head>
    <title>Create Blog</title>
</head>
<body>
    <h1>Create a Blog</h1>

    <form method="POST">
        {% csrf_token %}

        


        <label>Title:</label>
        <input type="text" name="title" required>

        <br><br>

        <label>Description:</label>
        <textarea name="description" required></textarea>

        <br><br>

        <button type="submit">Create Blog</button>
    </form>
</body>
</html>
